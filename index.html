<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Храм Огня — Лавка Душ</title>

  <!-- шрифты -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- шапка с инвентарем -->
  <header>
    <span class="logo-title">Храм Огня</span>
    <button class="open-cart-btn">
     Инвентарь: <span class="cart-count">0</span> | <span class="cart-total">0</span> душ
    </button>
  </header>

  <h1>Каталог товаров</h1>

  <!-- загрузка товаров с сайта -->
  <main class="products-container">
    <p style="grid-column: 1/-1; text-align: center;">Загрузка товаров...</p>
  </main>

  <!--  окно карточки товара и его отзывов -->
  <div class="product-modal">
    <div class="modal-content product-modal-content">
      <div class="modal-header">
        <h3 class="modal-product-title">Название предмета</h3>
        <button class="close-product-btn">✕</button>
      </div>

      <!-- детали товара -->
      <div class="product-detail-view">
        <img class="modal-product-img" src="" alt="Предмет">
        <div class="product-detail-info">
          <p class="product-price modal-product-price">0 душ</p>
          <button class="modal-product-buy-btn">Добавить в инвентарь</button>
        </div>
      </div>

      <!-- блок видеообзора -->
      <div class="product-video-section modal-video-section" style="display: none;">
        <h4>Летопись (Видеообзор)</h4>
        <div class="video-container modal-video-container"></div>
      </div>

      <hr class="modal-divider">

      <!-- секция отзывов конкретного товара -->
      <div class="product-reviews-section">
        <h4>Послания странников (Отзывы)</h4>

        <!-- форма добавления отзыва -->
        <form class="review-form product-review-form">
          <input type="text" class="review-author" placeholder="Ваше имя (например, Странник)" required>
          <textarea class="review-text" placeholder="Текст послания..." rows="2" required></textarea>

          <div style="display: flex; gap: 10px;">
            <select class="review-rating" style="flex: 1;">
              <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
              <option value="4">⭐⭐⭐⭐ (4/5)</option>
              <option value="3">⭐⭐⭐ (3/5)</option>
              <option value="2">⭐⭐ (2/5)</option>
              <option value="1">⭐ (1/5)</option>
            </select>
            <button type="submit" style="flex: 1;">Начертать</button>
          </div>
        </form>

        <!-- список отзывов этого товара -->
        <div class="reviews-container product-reviews-container"></div>
      </div>
    </div>
  </div>

  <!-- окно инвентаря (Корзина) -->
  <div class="cart-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Инвентарь героя</h3>
        <button class="close-cart-btn">✕</button>
      </div>
      
      <div class="cart-items-list"></div>
      
      <div class="modal-footer-total">
        <span>Итого:</span>
        <span class="modal-cart-total">0 душ</span>
      </div>
      
      <div class="modal-actions">
        <button class="clear-cart-btn">Очистить</button>
        <button class="checkout-btn">Потратить души (Купить)</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
