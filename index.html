<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Храм Огня — Лавка Душ</title>

  <!-- Шрифты -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    /* Основные переменные темы */
    :root {
      --ds-gold: #c49a45;
      --ds-gold-glow: #e0b85a;
      --ds-dark-bg: #0c0c0e;
      --ds-panel-bg: #141416;
      --ds-border: #2d261e;
      --ds-border-active: #846830;
      --ds-text: #c9c7c5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #17171a 0%, var(--ds-dark-bg) 80%);
      color: var(--ds-text);
      font-family: 'EB Garamond', serif;
      font-size: 16px;
      margin: 0;
      padding-bottom: 80px;
      min-height: 100vh;
    }

    /* Заголовки и кнопки */
    h1, h2, h3, header, button {
      font-family: 'Cinzel', serif;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    h1 {
      text-align: center;
      color: #e5e5e5;
      margin: 40px 0 20px;
      font-size: 32px;
    }

    h2 {
      text-align: center;
      color: #e5e5e5;
      margin-bottom: 25px;
    }

    /* Шапка сайта и кнопка инвентаря */
    header {
      position: sticky;
      top: 0;
      background: rgba(12, 12, 14, 0.95);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--ds-border-active);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    }

    .logo-title {
      font-weight: bold;
      color: #e5e5e5;
      font-size: 18px;
    }

    #open-cart-btn {
      background: #1e1e22;
      color: #e5e5e5;
      border: 1px solid var(--ds-border-active);
      padding: 10px 18px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    #open-cart-btn:hover {
      border-color: var(--ds-gold);
      box-shadow: 0 0 10px rgba(196, 154, 69, 0.3);
    }

    #cart-count, #cart-total {
      color: var(--ds-gold);
      font-weight: bold;
    }

    /* Сетка товаров 3 на 5 */
    #products-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
      max-width: 960px;
      margin: 30px auto 60px;
      padding: 0 20px;
    }

    /* Карточка товара */
    #products-container > div {
      background: linear-gradient(180deg, #18181b 0%, #111113 100%);
      border: 1px solid var(--ds-border);
      border-radius: 4px;
      padding: 20px 15px;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    #products-container > div:hover {
      transform: translateY(-5px);
      border-color: var(--ds-gold);
      box-shadow: 0 8px 24px rgba(196, 154, 69, 0.15), inset 0 0 15px rgba(196, 154, 69, 0.05);
    }

    /* Изображение внутри карточки */
    #products-container img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.6));
      transition: transform 0.3s ease;
      margin-bottom: 10px;
    }

    #products-container > div:hover img {
      transform: scale(1.08);
    }

    /* Название и цена */
    #products-container h3 {
      font-size: 15px;
      margin: 8px 0;
      color: #e5e5e5;
    }

    #products-container p {
      color: var(--ds-gold);
      font-weight: 600;
      margin: 5px 0 15px;
      font-size: 16px;
    }

    /* Кнопка Купить */
    #products-container button {
      background: transparent;
      color: var(--ds-gold);
      border: 1px solid var(--ds-border-active);
      border-radius: 2px;
      padding: 9px 20px;
      width: 100%;
      max-width: 140px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    #products-container button:hover {
      background: var(--ds-gold);
      color: #0c0c0e;
      box-shadow: 0 0 14px rgba(224, 184, 90, 0.5);
    }

    /* Отзывы */
    section {
      max-width: 800px;
      margin: 60px auto 0;
      padding: 30px 20px 0;
      border-top: 1px solid var(--ds-border);
    }

    #review-form {
      max-width: 500px;
      margin: 0 auto 30px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #review-form input,
    #review-form textarea,
    #review-form select {
      background: #111113;
      border: 1px solid var(--ds-border);
      border-radius: 4px;
      padding: 10px 14px;
      color: #fff;
      font-family: 'EB Garamond', serif;
      font-size: 16px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    #review-form textarea {
      resize: vertical;
    }

    #review-form input:focus,
    #review-form textarea:focus,
    #review-form select:focus {
      outline: none;
      border-color: var(--ds-gold);
      box-shadow: 0 0 8px rgba(196, 154, 69, 0.2);
    }

    #review-form button {
      background: var(--ds-gold);
      color: #111;
      font-weight: bold;
      border: none;
      padding: 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }

    #review-form button:hover {
      background: var(--ds-gold-glow);
      box-shadow: 0 0 12px rgba(224, 184, 90, 0.5);
    }

    /* Карточки отзывов */
    #reviews-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 600px;
      margin: 0 auto;
    }

    #reviews-container > div {
      background: #131316;
      border: 1px solid var(--ds-border);
      border-left: 3px solid var(--ds-gold);
      border-radius: 4px;
      padding: 14px 16px;
    }

    /* Окно инвентаря (Модалка) */
    #cart-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
    }

    #cart-modal .modal-content {
      background: #141416;
      border: 1px solid var(--ds-border-active);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
      border-radius: 6px;
      width: 90%;
      max-width: 480px;
      padding: 25px;
      color: #ddd;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--ds-border);
      padding-bottom: 10px;
    }

    .modal-header h3 {
      margin: 0;
      color: var(--ds-gold);
    }

    #close-cart-btn {
      background: none;
      border: none;
      color: #aaa;
      font-size: 20px;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    #close-cart-btn:hover {
      color: #fff;
    }

    #cart-items-list {
      max-height: 260px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 15px;
    }

    .modal-footer-total {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 15px;
    }

    #modal-cart-total {
      color: var(--ds-gold);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    #clear-cart-btn {
      flex: 1;
      background: #25252b;
      color: #eee;
      border: 1px solid var(--ds-border);
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    #clear-cart-btn:hover {
      background: #3a3a42;
    }

    #checkout-btn {
      flex: 2;
      background: var(--ds-gold);
      color: #111;
      font-weight: bold;
      border: none;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }

    #checkout-btn:hover {
      background: var(--ds-gold-glow);
      box-shadow: 0 0 10px rgba(224, 184, 90, 0.4);
    }

    /* Скроллбар */
    ::-webkit-scrollbar {
      width: 7px;
    }
    ::-webkit-scrollbar-track {
      background: var(--ds-dark-bg);
    }
    ::-webkit-scrollbar-thumb {
      background: #332d24;
      border-radius: 2px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--ds-gold);
    }
  </style>
</head>
<body>

  <!-- Шапка с инвентарем -->
  <header>
    <span class="logo-title">Храм Огня</span>
    <button id="open-cart-btn">
      🎒 Инвентарь: <span id="cart-count">0</span> | <span id="cart-total">0</span> душ
    </button>
  </header>

  <h1>Каталог товаров</h1>

  <!-- Загрузка товаров из MockAPI -->
  <main id="products-container">
    <p style="grid-column: 1/-1; text-align: center;">Загрузка товаров...</p>
  </main>

  <!-- Секция отзывов -->
  <section>
    <h2>Послания у костра (Отзывы)</h2>

    <!-- Форма для добавления отзыва -->
    <form id="review-form">
      <input type="text" id="review-author" placeholder="Ваше имя (например, Странник)" required>
      <textarea id="review-text" placeholder="Текст послания..." rows="3" required></textarea>

      <select id="review-rating">
        <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
        <option value="4">⭐⭐⭐⭐ (4/5)</option>
        <option value="3">⭐⭐⭐ (3/5)</option>
        <option value="2">⭐⭐ (2/5)</option>
        <option value="1">⭐ (1/5)</option>
      </select>

      <button type="submit">Оставить послание</button>
    </form>

    <!-- Отзывы из базы -->
    <div id="reviews-container"></div>
  </section>

  <!-- Модальное окно инвентаря -->
  <div id="cart-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Инвентарь героя</h3>
        <button id="close-cart-btn">✕</button>
      </div>
      
      <div id="cart-items-list"></div>
      
      <div class="modal-footer-total">
        <span>Итого:</span>
        <span id="modal-cart-total">0 душ</span>
      </div>
      
      <div class="modal-actions">
        <button id="clear-cart-btn">Очистить</button>
        <button id="checkout-btn">Потратить души (Купить)</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
